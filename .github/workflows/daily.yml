name: Daily MSSQL-FTS wrapper image

on:
  schedule:
    # Daily rebuild at 05:39 UTC
    - cron: '39 5 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mssql_2025_version:
        description: 'Optional SQL Server 2025 APT version override'
        required: false
        default: ''
      mssql_2022_version:
        description: 'Optional SQL Server 2022 APT version override'
        required: false
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dgcosenza/mssql-fts

jobs:
  public-check:
    name: Public content check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public-content rules, attribution, and license badges
        env:
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: .github/scripts/public-check.sh

  hadolint:
    name: Hadolint Dockerfile lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (blocking on warning+)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VER="8.30.1"
          SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          rm -f /tmp/gitleaks /tmp/gitleaks.tar.gz
      - name: Scan git history for secrets
        shell: bash
        run: gitleaks git --verbose --redact --no-banner

  resolve:
    name: Resolve latest Microsoft CU metadata and Ubuntu LTS digests
    needs: [public-check, hadolint, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mssql_2025_full: ${{ steps.resolve.outputs.mssql_2025_full }}
      mssql_2025_short: ${{ steps.resolve.outputs.mssql_2025_short }}
      mssql_2022_full: ${{ steps.resolve.outputs.mssql_2022_full }}
      mssql_2022_short: ${{ steps.resolve.outputs.mssql_2022_short }}
      mssql_tools18_version: ${{ steps.resolve.outputs.mssql_tools18_version }}
      ubuntu_2404_base: ${{ steps.resolve.outputs.ubuntu_2404_base }}
      ubuntu_2404_digest: ${{ steps.resolve.outputs.ubuntu_2404_digest }}
      ubuntu_2204_base: ${{ steps.resolve.outputs.ubuntu_2204_base }}
      ubuntu_2204_digest: ${{ steps.resolve.outputs.ubuntu_2204_digest }}
      build_date: ${{ steps.resolve.outputs.build_date }}
      build_date_iso: ${{ steps.resolve.outputs.build_date_iso }}
      created: ${{ steps.resolve.outputs.created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Microsoft APT metadata and Ubuntu base digests
        id: resolve
        shell: bash
        env:
          OVERRIDE_2025: ${{ inputs.mssql_2025_version }}
          OVERRIDE_2022: ${{ inputs.mssql_2022_version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve-versions.py
          {
            echo "build_date=$(date -u +%Y%m%d)"
            echo "build_date_iso=$(date -u +%Y-%m-%d)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload upstream changes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-changes
          path: upstream-changes.md
          retention-days: 90

  build-test-scan:
    name: Build, live FTS smoke, Dive, SBOM & scan (SQL Server ${{ matrix.track }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: '2025'
            ubuntu_version: '24.04'
            ubuntu_codename: 'noble'
          - track: '2022'
            ubuntu_version: '22.04'
            ubuntu_codename: 'jammy'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Select track build arguments
        id: track_args
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
          BASE_2404: ${{ needs.resolve.outputs.ubuntu_2404_base }}
          BASE_2204: ${{ needs.resolve.outputs.ubuntu_2204_base }}
          VER_2025: ${{ needs.resolve.outputs.mssql_2025_full }}
          VER_2022: ${{ needs.resolve.outputs.mssql_2022_full }}
        run: |
          set -euo pipefail
          if [ "$TRACK" = "2025" ]; then
            echo "ubuntu_base=${BASE_2404}" >> "$GITHUB_OUTPUT"
            echo "tested_version=${VER_2025}" >> "$GITHUB_OUTPUT"
          else
            echo "ubuntu_base=${BASE_2204}" >> "$GITHUB_OUTPUT"
            echo "tested_version=${VER_2022}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SQL Server ${{ matrix.track }} zero-binary wrapper (linux/amd64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.track }}
          build-args: |
            UBUNTU_BASE=${{ steps.track_args.outputs.ubuntu_base }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            UBUNTU_CODENAME=${{ matrix.ubuntu_codename }}
            MSSQL_MAJOR=${{ matrix.track }}
            MSSQL_TESTED_VERSION=${{ steps.track_args.outputs.tested_version }}
            IMAGE_CREATED=${{ needs.resolve.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Inspect OS version and image size
        id: inspect_image
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          IMG="${IMAGE_NAME}:ci-candidate-${TRACK}"
          OS_PRETTY="$(docker run --rm --entrypoint bash "$IMG" -c '. /etc/os-release && echo "$VERSION_ID ($VERSION_CODENAME)"')"
          SIZE_BYTES="$(docker image inspect --format='{{.Size}}' "$IMG")"
          SIZE_MB="$(python3 -c "print(f'{int(${SIZE_BYTES})/1000000:.1f}')")"
          {
            echo "os_pretty=${OS_PRETTY}"
            echo "size_bytes=${SIZE_BYTES}"
            echo "size_mb=${SIZE_MB}"
          } >> "$GITHUB_OUTPUT"
          echo "Detected (track ${TRACK}): Ubuntu=${OS_PRETTY}, Size=${SIZE_MB} MB"
          echo "### Image size (SQL Server ${TRACK}): **${SIZE_MB} MB** (${SIZE_BYTES} bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Live FTS smoke test (SQL Server ${{ matrix.track }})
        shell: bash
        run: ./tests/smoke.sh "${IMAGE_NAME}:ci-candidate-${{ matrix.track }}"

      - name: Install verified Dive, Syft, and Grype
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/dive.tar.gz "https://github.com/wagoodman/dive/releases/download/v0.13.1/dive_0.13.1_linux_amd64.tar.gz"
          echo "0970549eb4a306f8825a84145a2534153badb4d7dcf3febd1967c706367c3d0e  /tmp/dive.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dive.tar.gz -C /tmp dive
          install -m 0755 /tmp/dive /usr/local/bin/dive

          curl -fsSLo /tmp/syft.tar.gz "https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz"
          echo "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          install -m 0755 /tmp/syft /usr/local/bin/syft

          curl -fsSLo /tmp/grype.tar.gz "https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz"
          echo "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538  /tmp/grype.tar.gz" | sha256sum -c -
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          install -m 0755 /tmp/grype /usr/local/bin/grype

          rm -f /tmp/dive /tmp/dive.tar.gz /tmp/syft /tmp/syft.tar.gz /tmp/grype /tmp/grype.tar.gz

      - name: Dive image efficiency gate (SQL Server ${{ matrix.track }})
        shell: bash
        env:
          CI: 'true'
        run: dive --ci-config .dive-ci "${IMAGE_NAME}:ci-candidate-${{ matrix.track }}"

      - name: Generate SPDX and CycloneDX SBOMs with Syft (SQL Server ${{ matrix.track }})
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          IMG="docker:${IMAGE_NAME}:ci-candidate-${TRACK}"
          syft "$IMG" -o "spdx-json=sbom-${TRACK}.spdx.json"
          syft "$IMG" -o "cyclonedx-json=sbom-${TRACK}.cdx.json"

      - name: Scan image with Trivy — informational table (SQL Server ${{ matrix.track }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.track }}'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          output: 'trivy-report-${{ matrix.track }}.txt'

      - name: Scan image with Trivy — JSON for CVE diffing (SQL Server ${{ matrix.track }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.track }}'
          format: 'json'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          output: 'trivy-report-${{ matrix.track }}.json'

      - name: Compute CVE diff against previous build (SQL Server ${{ matrix.track }})
        shell: bash
        run: python3 .github/scripts/cve-diff.py versions.json "trivy-report-${{ matrix.track }}.json" "cve-diff-${{ matrix.track }}.json"

      - name: Scan image with Trivy — SARIF for code scanning (SQL Server ${{ matrix.track }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.track }}'
          format: 'sarif'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          output: 'trivy-results-${{ matrix.track }}.sarif'
          exit-code: '0'

      - name: Upload Trivy SARIF to code scanning (SQL Server ${{ matrix.track }})
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # codeql-bundle-v2.27.6
        with:
          sarif_file: 'trivy-results-${{ matrix.track }}.sarif'
          category: trivy-mssql-fts-${{ matrix.track }}

      - name: Scan image with Trivy — HARD GATE (0 fixable CRITICAL/HIGH, SQL Server ${{ matrix.track }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate-${{ matrix.track }}'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan SPDX SBOM with Grype — HARD GATE (0 fixable CRITICAL/HIGH, SQL Server ${{ matrix.track }})
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: |
          set -euo pipefail
          grype "sbom:sbom-${TRACK}.spdx.json" --only-fixed --fail-on high -o table | tee "grype-report-${TRACK}.txt"

      - name: Log in to GHCR for verified digest staging
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified SQL Server ${{ matrix.track }} manifest by digest to GHCR
        id: push_digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            UBUNTU_BASE=${{ steps.track_args.outputs.ubuntu_base }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
            UBUNTU_CODENAME=${{ matrix.ubuntu_codename }}
            MSSQL_MAJOR=${{ matrix.track }}
            MSSQL_TESTED_VERSION=${{ steps.track_args.outputs.tested_version }}
            IMAGE_CREATED=${{ needs.resolve.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Record per-track metadata
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
          DIGEST: ${{ steps.push_digest.outputs.digest }}
          OS_PRETTY: ${{ steps.inspect_image.outputs.os_pretty }}
          SIZE_BYTES: ${{ steps.inspect_image.outputs.size_bytes }}
          SIZE_MB: ${{ steps.inspect_image.outputs.size_mb }}
        run: |
          set -euo pipefail
          jq -n \
            --arg track "$TRACK" \
            --arg digest "$DIGEST" \
            --arg os_pretty "$OS_PRETTY" \
            --arg size_mb "$SIZE_MB" \
            --argjson size_bytes "$SIZE_BYTES" \
            '{track: $track, digest: $digest, os_pretty: $os_pretty, size_mb: $size_mb, size_bytes: $size_bytes}' \
            > "track-meta-${TRACK}.json"

      - name: Upload per-track reports, SBOMs, and metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: track-artifacts-${{ matrix.track }}
          path: |
            track-meta-${{ matrix.track }}.json
            sbom-${{ matrix.track }}.spdx.json
            sbom-${{ matrix.track }}.cdx.json
            trivy-report-${{ matrix.track }}.txt
            trivy-report-${{ matrix.track }}.json
            cve-diff-${{ matrix.track }}.json
            grype-report-${{ matrix.track }}.txt
          retention-days: 90
          if-no-files-found: ignore

  publish:
    name: Publish tags, Cosign sign/attest, SLSA L3, and Release
    needs: [resolve, build-test-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download per-track artifacts and upstream changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .ci-in

      - name: Install verified crane
        shell: bash
        run: |
          set -euo pipefail
          SHA="0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
          curl -fsSLo /tmp/crane.tar.gz "https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${SHA}  /tmp/crane.tar.gz" | sha256sum -c -
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          install -m 0755 /tmp/crane /usr/local/bin/crane
          rm -f /tmp/crane /tmp/crane.tar.gz

      - name: Install Cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub publish credentials
        id: hub_auth
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.hub_auth.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag GHCR manifests and mirror identical digests to Docker Hub
        id: tags
        shell: bash
        env:
          V2025: ${{ needs.resolve.outputs.mssql_2025_short }}
          V2022: ${{ needs.resolve.outputs.mssql_2022_short }}
          BDATE: ${{ needs.resolve.outputs.build_date }}
          HUB_ENABLED: ${{ steps.hub_auth.outputs.enabled }}
        run: |
          set -euo pipefail
          DIG_2025="$(jq -r '.digest' .ci-in/track-artifacts-2025/track-meta-2025.json)"
          DIG_2022="$(jq -r '.digest' .ci-in/track-artifacts-2022/track-meta-2022.json)"
          test -n "$DIG_2025" && test -n "$DIG_2022"

          SHA_TAG="sha-${GITHUB_SHA::7}"
          DATE_2025="${V2025}-${BDATE}"
          DATE_2022="${V2022}-${BDATE}"

          for t in latest 2025-latest 2025 "${V2025}" "${DATE_2025}" "${SHA_TAG}"; do
            crane tag "ghcr.io/${IMAGE_NAME}@${DIG_2025}" "$t"
          done
          for t in 2022-latest 2022 "${V2022}" "${DATE_2022}"; do
            crane tag "ghcr.io/${IMAGE_NAME}@${DIG_2022}" "$t"
          done

          if [ "$HUB_ENABLED" = "true" ]; then
            crane copy "ghcr.io/${IMAGE_NAME}@${DIG_2025}" "index.docker.io/${IMAGE_NAME}:latest"
            for t in 2025-latest 2025 "${V2025}" "${DATE_2025}" "${SHA_TAG}"; do
              crane tag "index.docker.io/${IMAGE_NAME}@${DIG_2025}" "$t"
            done
            test "$(crane digest "index.docker.io/${IMAGE_NAME}:latest")" = "${DIG_2025}"

            crane copy "ghcr.io/${IMAGE_NAME}@${DIG_2022}" "index.docker.io/${IMAGE_NAME}:2022-latest"
            for t in 2022 "${V2022}" "${DATE_2022}"; do
              crane tag "index.docker.io/${IMAGE_NAME}@${DIG_2022}" "$t"
            done
            test "$(crane digest "index.docker.io/${IMAGE_NAME}:2022-latest")" = "${DIG_2022}"
          fi

          {
            echo "digest_2025=${DIG_2025}"
            echo "digest_2022=${DIG_2022}"
            echo "date_tag_2025=${DATE_2025}"
            echo "date_tag_2022=${DATE_2022}"
            echo "sha_tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Keyless Cosign sign and SBOM attest (GHCR + Docker Hub)
        shell: bash
        env:
          DIG_2025: ${{ steps.tags.outputs.digest_2025 }}
          DIG_2022: ${{ steps.tags.outputs.digest_2022 }}
          HUB_ENABLED: ${{ steps.hub_auth.outputs.enabled }}
        run: |
          set -euo pipefail
          REGISTRIES=("ghcr.io/${IMAGE_NAME}")
          if [ "$HUB_ENABLED" = "true" ]; then
            REGISTRIES+=("index.docker.io/${IMAGE_NAME}")
          fi

          for reg in "${REGISTRIES[@]}"; do
            cosign sign --yes "${reg}@${DIG_2025}"
            cosign attest --yes --predicate .ci-in/track-artifacts-2025/sbom-2025.spdx.json --type spdxjson "${reg}@${DIG_2025}"
            cosign attest --yes --predicate .ci-in/track-artifacts-2025/sbom-2025.cdx.json --type cyclonedx "${reg}@${DIG_2025}"

            cosign sign --yes "${reg}@${DIG_2022}"
            cosign attest --yes --predicate .ci-in/track-artifacts-2022/sbom-2022.spdx.json --type spdxjson "${reg}@${DIG_2022}"
            cosign attest --yes --predicate .ci-in/track-artifacts-2022/sbom-2022.cdx.json --type cyclonedx "${reg}@${DIG_2022}"
          done

      - name: Attest SLSA Build L3 provenance (GHCR 2025)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.tags.outputs.digest_2025 }}
          push-to-registry: true

      - name: Attest SLSA Build L3 provenance (GHCR 2022)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.tags.outputs.digest_2022 }}
          push-to-registry: true

      - name: Attest SLSA Build L3 provenance (Docker Hub 2025)
        if: steps.hub_auth.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.tags.outputs.digest_2025 }}
          push-to-registry: true

      - name: Attest SLSA Build L3 provenance (Docker Hub 2022)
        if: steps.hub_auth.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.tags.outputs.digest_2022 }}
          push-to-registry: true

      - name: Publish signed GitHub Release with SBOMs and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tags.outputs.date_tag_2025 }}
          V2025_FULL: ${{ needs.resolve.outputs.mssql_2025_full }}
          V2022_FULL: ${{ needs.resolve.outputs.mssql_2022_full }}
          TOOLS18: ${{ needs.resolve.outputs.mssql_tools18_version }}
          DIG_2025: ${{ steps.tags.outputs.digest_2025 }}
          DIG_2022: ${{ steps.tags.outputs.digest_2022 }}
          HUB_ENABLED: ${{ steps.hub_auth.outputs.enabled }}
        run: |
          set -euo pipefail
          mkdir -p .rel
          cp .ci-in/track-artifacts-2025/sbom-2025.spdx.json .rel/
          cp .ci-in/track-artifacts-2025/sbom-2025.cdx.json .rel/
          cp .ci-in/track-artifacts-2022/sbom-2022.spdx.json .rel/
          cp .ci-in/track-artifacts-2022/sbom-2022.cdx.json .rel/

          MB_2025="$(jq -r '.size_mb' .ci-in/track-artifacts-2025/track-meta-2025.json)"
          MB_2022="$(jq -r '.size_mb' .ci-in/track-artifacts-2022/track-meta-2022.json)"

          (
            cd .rel
            {
              echo "# OCI digests (linux/amd64)"
              echo "${DIG_2025}  ghcr.io/${IMAGE_NAME}:2025-latest"
              [ "$HUB_ENABLED" = "true" ] && echo "${DIG_2025}  docker.io/${IMAGE_NAME}:2025-latest"
              echo "${DIG_2022}  ghcr.io/${IMAGE_NAME}:2022-latest"
              [ "$HUB_ENABLED" = "true" ] && echo "${DIG_2022}  docker.io/${IMAGE_NAME}:2022-latest"
              echo "# SBOM SHA-256 checksums"
              sha256sum sbom-*.json
            } > checksums.txt
            cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
          )

          cat > .rel/notes.md <<EOF
          ## Microsoft SQL Server + Full-Text Search Runtime Wrapper (${TAG})

          Maintained by **Daniel G. Cosenza from FNX Labs**.

          ### Verified Components
          - **Proprietary binaries in published image:** **None (0)** — official GPG-verified packages are fetched directly from \`packages.microsoft.com\` at container startup after \`ACCEPT_EULA=Y\`
          - **SQL Server 2025 track (\`latest\`, \`2025-latest\`):** Ubuntu 24.04 LTS (${MB_2025} MB), smoke-tested live with \`${V2025_FULL}\` + FTS \`CONTAINS\` query
          - **SQL Server 2022 track (\`2022-latest\`):** Ubuntu 22.04 LTS (${MB_2022} MB), smoke-tested live with \`${V2022_FULL}\` + FTS \`CONTAINS\` query
          - **Client tools (runtime-fetched):** \`mssql-tools18 ${TOOLS18}\`
          - **Security gate:** 0 fixable Critical/High (Trivy + Grype on SPDX SBOM), Dive efficiency >= 95%

          ### Identical Signed Digests (GHCR + Docker Hub)
          - **2025 / latest:** \`ghcr.io/${IMAGE_NAME}@${DIG_2025}\`
          - **2022-latest:** \`ghcr.io/${IMAGE_NAME}@${DIG_2022}\`

          ### Cosign Verification
          \`\`\`bash
          cosign verify \\
            --certificate-identity-regexp="^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/daily\\.yml@refs/heads/main$" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ghcr.io/${IMAGE_NAME}@${DIG_2025}
          \`\`\`
          EOF

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "MSSQL-FTS Wrapper ${TAG}" --notes-file .rel/notes.md
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber \
              .rel/checksums.txt .rel/checksums.txt.sigstore.json \
              .rel/sbom-2025.spdx.json .rel/sbom-2025.cdx.json \
              .rel/sbom-2022.spdx.json .rel/sbom-2022.cdx.json
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "MSSQL-FTS Wrapper ${TAG}" \
              --notes-file .rel/notes.md \
              .rel/checksums.txt .rel/checksums.txt.sigstore.json \
              .rel/sbom-2025.spdx.json .rel/sbom-2025.cdx.json \
              .rel/sbom-2022.spdx.json .rel/sbom-2022.cdx.json
          fi

      - name: Build updated versions metadata
        shell: bash
        env:
          DIG_2025: ${{ steps.tags.outputs.digest_2025 }}
          DIG_2022: ${{ steps.tags.outputs.digest_2022 }}
          HUB_ENABLED: ${{ steps.hub_auth.outputs.enabled }}
        run: |
          set -euo pipefail
          OS_2025="$(jq -r '.os_pretty' .ci-in/track-artifacts-2025/track-meta-2025.json)"
          OS_2022="$(jq -r '.os_pretty' .ci-in/track-artifacts-2022/track-meta-2022.json)"
          MB_2025="$(jq -r '.size_mb' .ci-in/track-artifacts-2025/track-meta-2025.json)"
          MB_2022="$(jq -r '.size_mb' .ci-in/track-artifacts-2022/track-meta-2022.json)"

          HUB_2025=""; HUB_2022=""
          if [ "$HUB_ENABLED" = "true" ]; then
            HUB_2025="${IMAGE_NAME}@${DIG_2025}"
            HUB_2022="${IMAGE_NAME}@${DIG_2022}"
          fi
          GHCR_2025="ghcr.io/${IMAGE_NAME}@${DIG_2025}"
          GHCR_2022="ghcr.io/${IMAGE_NAME}@${DIG_2022}"

          cp .ci-in/upstream-changes/upstream-changes.md upstream-changes.md
          cp .ci-in/track-artifacts-2025/cve-diff-2025.json cve-diff.json

          jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg upstream_name "Microsoft SQL Server + Full-Text Search (runtime-fetched)" \
            --arg upstream_license "Proprietary-EULA" \
            --arg v2025_short "${{ needs.resolve.outputs.mssql_2025_short }}" \
            --arg v2025_full "${{ needs.resolve.outputs.mssql_2025_full }}" \
            --arg v2022_full "${{ needs.resolve.outputs.mssql_2022_full }}" \
            --arg tools18 "${{ needs.resolve.outputs.mssql_tools18_version }}" \
            --arg os_2025 "${OS_2025}" \
            --arg os_2022 "${OS_2022}" \
            --arg base_digest "${{ needs.resolve.outputs.ubuntu_2404_digest }}" \
            --arg build_date "${{ needs.resolve.outputs.build_date_iso }}" \
            --arg built_at_utc "${{ needs.resolve.outputs.created }}" \
            --arg hub_2025 "${HUB_2025}" \
            --arg ghcr_2025 "${GHCR_2025}" \
            --arg hub_2022 "${HUB_2022}" \
            --arg ghcr_2022 "${GHCR_2022}" \
            --arg mb_2025 "${MB_2025}" \
            --arg mb_2022 "${MB_2022}" \
            --slurpfile cve cve-diff.json \
            '{
              image: $image,
              upstream_name: $upstream_name,
              upstream_license: $upstream_license,
              packaging_license: "MIT",
              upstream_version: $v2025_short,
              upstream_commit: "",
              changelog_version: $v2025_short,
              architectures: ["linux/amd64"],
              sizes_mb: { "2025": $mb_2025, "2022": $mb_2022 },
              signed: true,
              slsa_provenance: true,
              components: {
                "2025 Track Base OS": ("Ubuntu " + $os_2025),
                "2025 Track Tested CU (runtime-fetched)": $v2025_full,
                "2022 Track Base OS": ("Ubuntu " + $os_2022),
                "2022 Track Tested CU (runtime-fetched)": $v2022_full,
                "Client Tools (runtime-fetched)": ("mssql-tools18 " + $tools18),
                "Proprietary Binaries in Published Image": "None (0)"
              },
              base_image: "ubuntu:24.04",
              base_digest: $base_digest,
              build_date: $build_date,
              built_at_utc: $built_at_utc,
              image_digest: $hub_2025,
              ghcr_digest: $ghcr_2025,
              image_digest_2022: $hub_2022,
              ghcr_digest_2022: $ghcr_2022,
              fixable_critical_high: ($cve[0].fixable_critical_high // 0),
              unfixed_cves: ($cve[0].unfixed_cves // [])
            }' > versions-new.json

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            versions-new.json
            upstream-changes.md
            cve-diff.json
          retention-days: 90

  update-docs:
    name: Update docs and sync Docker Hub overview
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: .ci-meta

      - name: Update versions.json, README.md, and CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update-docs.py \
            .ci-meta/versions-new.json \
            .ci-meta/upstream-changes.md \
            .ci-meta/cve-diff.json
          rm -rf .ci-meta
          .github/scripts/public-check.sh

      - name: Commit docs and push temp branch
        id: docs_commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain versions.json README.md CHANGELOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json README.md CHANGELOG.md
            git commit -m "chore(docs): update daily build metadata and changelog [skip ci]"
            SHA="$(git rev-parse HEAD)"
            TMPBRANCH="tmp/docs-${GITHUB_RUN_ID}"
            git branch "$TMPBRANCH"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "$TMPBRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
            echo "tmpbranch=${TMPBRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No documentation or version metadata changes to commit."
          fi

      - name: Install Gitleaks
        if: steps.docs_commit.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VER="8.30.1"
          SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          rm -f /tmp/gitleaks /tmp/gitleaks.tar.gz

      - name: Run required public content check
        id: public_check
        if: always() && steps.docs_commit.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        env:
          PR_TEXT: ""
        run: |
          set -euo pipefail
          .github/scripts/public-check.sh 2>&1 | tee /tmp/public-check.txt

      - name: Run required Hadolint lint
        id: hadolint_check
        if: always() && steps.docs_commit.outputs.changed == 'true'
        continue-on-error: true
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Run required Gitleaks scan
        id: gitleaks_check
        if: always() && steps.docs_commit.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --verbose --redact --no-banner 2>&1 | tee /tmp/gitleaks-check.txt

      - name: Report required checks and push docs to main
        if: always() && steps.docs_commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.docs_commit.outputs.sha }}
          TMPBRANCH: ${{ steps.docs_commit.outputs.tmpbranch }}
          PUBLIC_OUTCOME: ${{ steps.public_check.outcome }}
          HADOLINT_OUTCOME: ${{ steps.hadolint_check.outcome }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks_check.outcome }}
        run: |
          set -euo pipefail
          post_check() {
            local ctx="$1" outcome="$2" file="$3"
            local conclusion="success"
            [ "$outcome" = "success" ] || conclusion="failure"
            local summary="Outcome: ${outcome}"
            local text="See the workflow run logs for full details."
            if [ -f "$file" ] && [ -s "$file" ]; then
              text="$(tail -c 60000 "$file" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g' | awk '{printf "%s\\n", $0}')"
            fi
            jq -n \
              --arg name "$ctx" \
              --arg head_sha "$SHA" \
              --arg conclusion "$conclusion" \
              --arg summary "$summary" \
              --arg text "$text" \
              '{name:$name, head_sha:$head_sha, status:"completed", conclusion:$conclusion, output:{title:$name, summary:$summary, text:$text}}' \
              > /tmp/check-run.json
            gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input /tmp/check-run.json >/dev/null
          }

          post_check "Public content check" "$PUBLIC_OUTCOME" /tmp/public-check.txt
          post_check "Hadolint Dockerfile lint" "$HADOLINT_OUTCOME" hadolint-check.txt
          post_check "Gitleaks secret scan" "$GITLEAKS_OUTCOME" /tmp/gitleaks-check.txt

          if [ "$PUBLIC_OUTCOME" != "success" ] || [ "$HADOLINT_OUTCOME" != "success" ] || [ "$GITLEAKS_OUTCOME" != "success" ]; then
            echo "One or more required checks failed; not pushing docs to main." >&2
            git push origin --delete "$TMPBRANCH" || true
            exit 1
          fi

          for _attempt in 1 2 3; do
            git push origin "${TMPBRANCH}:main" && break
            echo "push attempt ${_attempt} failed; retrying..." >&2
            sleep 5
          done
          git push origin --delete "$TMPBRANCH" || true

      - name: Check Docker Hub sync credentials
        id: hub_sync
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            DESC="$(tr -d '\r\n' < DOCKERHUB_SHORT_DESCRIPTION)"
            if [ "${#DESC}" -gt 100 ]; then
              echo "ERROR: DOCKERHUB_SHORT_DESCRIPTION exceeds 100 characters (${#DESC})." >&2
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "short_desc=${DESC}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Docker Hub repository overview (short & full description)
        if: steps.hub_sync.outputs.enabled == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ steps.hub_sync.outputs.short_desc }}
          readme-filepath: ./README.md

  alert-on-status:
    name: Manage CI failure alert issue
    needs: [public-check, hadolint, gitleaks, resolve, build-test-scan, publish, update-docs]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open/update or auto-close ci-failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RES_PUBLIC: ${{ needs.public-check.result }}
          RES_HADOLINT: ${{ needs.hadolint.result }}
          RES_GITLEAKS: ${{ needs.gitleaks.result }}
          RES_RESOLVE: ${{ needs.resolve.result }}
          RES_BUILD: ${{ needs.build-test-scan.result }}
          RES_PUBLISH: ${{ needs.publish.result }}
          RES_DOCS: ${{ needs.update-docs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          FAILED=()
          [ "$RES_PUBLIC" != "success" ] && FAILED+=("public-check (${RES_PUBLIC})")
          [ "$RES_HADOLINT" != "success" ] && FAILED+=("hadolint (${RES_HADOLINT})")
          [ "$RES_GITLEAKS" != "success" ] && FAILED+=("gitleaks (${RES_GITLEAKS})")
          [ "$RES_RESOLVE" != "success" ] && FAILED+=("resolve (${RES_RESOLVE})")
          [ "$RES_BUILD" != "success" ] && FAILED+=("build-test-scan (${RES_BUILD})")
          [ "$RES_PUBLISH" != "success" ] && FAILED+=("publish (${RES_PUBLISH})")
          [ "$RES_DOCS" != "success" ] && FAILED+=("update-docs (${RES_DOCS})")

          OPEN_ISSUE="$(gh issue list -R "$GITHUB_REPOSITORY" --label ci-failure --state open --json number --jq '.[0].number // empty')"

          if [ "${#FAILED[@]}" -gt 0 ]; then
            gh label create ci-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "Automated daily CI failure alert" --force >/dev/null 2>&1 || true
            FAIL_LIST="$(IFS=', '; echo "${FAILED[*]}")"
            TITLE="Daily build failed: ${FAIL_LIST}"
            BODY="$(printf 'Automated daily pipeline failed on `%s` (%s UTC).\n\n- **Failing job(s):** %s\n- **Event:** `%s`\n- **Workflow run:** %s\n' \
              "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$FAIL_LIST" "${{ github.event_name }}" "$RUN_URL")"
            if [ -n "$OPEN_ISSUE" ]; then
              gh issue edit "$OPEN_ISSUE" -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
              gh issue comment "$OPEN_ISSUE" -R "$GITHUB_REPOSITORY" --body "Latest failing run: ${RUN_URL} (${FAIL_LIST})."
            else
              gh issue create -R "$GITHUB_REPOSITORY" --label ci-failure --title "$TITLE" --body "$BODY"
            fi
          elif [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" -R "$GITHUB_REPOSITORY" --body "Daily pipeline recovered and passed on ${RUN_URL}. Closing automatically."
            gh issue close "$OPEN_ISSUE" -R "$GITHUB_REPOSITORY"
          fi
